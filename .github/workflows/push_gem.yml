name: Publish gem to rubygems.org

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    if: >-
      github.repository == 'ruby/shellwords' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/shellwords

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: ruby

      - name: Verify release tag
        run: |
          test "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          test "$TAG_NAME" = "v$(ruby -Ilib -rshellwords -e 'print Shellwords::VERSION')"

      - name: Install dependencies
        run: bundle install

      - name: Publish to RubyGems
        uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0

      - name: Create GitHub release
        run: |
          tag_type="$(git cat-file -t "refs/tags/${TAG_NAME}")"
          if [ "$tag_type" = tag ]; then
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-from-tag
          else
            gh release create "$TAG_NAME" --verify-tag --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
